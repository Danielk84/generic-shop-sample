app:
  mode: debug # or release
  max_multipart_memory: 10 # MiB
  trusted_proxies:
    - "127.0.0.1"
    - "::1"
    - "0.0.0.0"
  app_logger_filepath: "./logs/app.log"
  addr: ":8080"

auth:
  auth_expiration: 24

email_broker:
  from_email: "noreply@example.com"
  smtp_host: "mail"
  smtp_port: 1025
  smtp_password: ""

product_image:
  max_product_images_amount: 6

payment:
  zp_merchant_id: "YOUR_ZARINPAL_MERCHANT_ID"
  payment_callback_url: "https://example.com/payment/callback"

file_upload:
  allowed_image_mimetype:
    - "image/jpeg"
    - "image/png"
    - "image/webp"
    - "image/gif"
    - "image/avif"
  aws_s3:
    key: "test"
    secret: "test"
    region: "us-east-1"
    endpoint: "http://storage:8333"

request_logger_filepath: "./logs/request.log"

database_url: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

cache_url: "redis://cache:6379/"

pagination: 20

jwt_secret_key: "your-super-secret-jwt-key"
