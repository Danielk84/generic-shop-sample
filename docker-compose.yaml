services:
  proxyserver:
    image: nginx:1.31-alpine
    container_name: proxyserver
    restart: always
    volumes:
        - type: bind
          source: "./nginx"
          target: "/etc/nginx"
          read_only: true
    ports:
      - 8080:8080
    networks:
      - server
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org}
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      MIGRATE_VERSION: ${MIGRATE_VERSION:-11}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - type: bind
        source: ${BACKEND_CONFIG:-./docker/configs/server.yaml}
        target: "/app/config.yaml"
        read_only: true
      - backend-deps:/go
      - backend-build-cache:/root/.cache/go-build
      - backend-upload:/app/upload
      - backend-logs:/app/logs
    networks:
      - server
    depends_on:
      database:
        condition: service_healthy
        restart: true
      cache:
        condition: service_healthy
        restart: true
      mail:
        condition: service_healthy
        restart: true
      storage:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O-",
        "http://backend:8080/api/auth/healthz"]
      interval: 10m
      timeout: 60s
      retries: 3
      start_period: 30s

  
  database:
    image: postgres:18-alpine3.24
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10m
      timeout: 60s
      retries: 3
      start_period: 30s

  cache:
    container_name: cache
    image: redis:8-alpine
    restart: always
    networks:
      - server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 30s

  mail:
    container_name: mail
    image: axllent/mailpit:v1.30
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    ports:
      - 8025:8025
    networks:
      - server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://mail:8025/livez"]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 30s

  storage:
    container_name: storage
    image: chrislusf/seaweedfs:4.40
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret}
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -master.port=9333
      -volume.port=9080
    networks:
      - server
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://storage:8333/healthz"]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 30s

volumes:
  backend-deps:
  backend-build-cache:
  backend-upload:
  backend-logs:
  database-data:
  storage-data:

networks:
  server:
