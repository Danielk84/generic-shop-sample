services:
  database:
    image: postgres:18-alpine3.24
    container_name: database-dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - database-data-dev:/var/lib/postgresql
    networks:
      - server-dev
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  cache:
    container_name: cache-dev
    image: redis:8-alpine
    restart: always
    networks:
      - server-dev
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mail:
    container_name: mail-dev
    image: axllent/mailpit:v1.30
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    networks:
      - server-dev
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  storage:
    container_name: storage-dev
    image: chrislusf/seaweedfs:4.40
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -master.port=9333
      -volume.port=9080
    networks:
      - server-dev
    volumes:
      - storage-data-dev:/data
    ports:
      - 8333:8333
      - 9333:9333
      - 9080:9080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8333"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database-data-dev:
  storage-data-dev:

networks:
  server-dev:
