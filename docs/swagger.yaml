basePath: /api
definitions:
  api.AvailableQuantity:
    properties:
      num:
        type: integer
    required:
    - num
    type: object
  api.PC:
    properties:
      tags:
        items:
          type: string
        type: array
    required:
    - tags
    type: object
  api.SetFlag:
    properties:
      accepted:
        type: boolean
    type: object
  api.VerfierKey:
    properties:
      num:
        type: integer
    required:
    - num
    type: object
  queries.BaseOrderItemRequest:
    properties:
      order_id:
        type: string
      product_id:
        type: string
    required:
    - order_id
    - product_id
    type: object
  queries.Category:
    properties:
      id:
        type: integer
      tag:
        type: string
    required:
    - tag
    type: object
  queries.CategoryTag:
    properties:
      tag:
        type: string
    required:
    - tag
    type: object
  queries.CommentRequest:
    properties:
      body:
        type: string
      parent:
        type: string
      referrer:
        type: string
    required:
    - referrer
    type: object
  queries.CommentResponse:
    properties:
      body:
        type: string
      children_amount:
        type: integer
      id:
        type: string
      pub_date:
        type: string
      username:
        type: string
    type: object
  queries.CreateProductRequest:
    properties:
      description:
        type: string
      details:
        type: string
      is_available:
        type: boolean
      name:
        maxLength: 256
        minLength: 4
        type: string
      price:
        minimum: 0
        type: integer
    required:
    - description
    - name
    - price
    type: object
  queries.CreateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        type: string
      permission_type:
        allOf:
        - $ref: '#/definitions/queries.PermissionType'
        minimum: 0
      username:
        type: string
    required:
    - password
    - username
    type: object
  queries.EmailAddrRequest:
    properties:
      email:
        maxLength: 256
        minLength: 10
        type: string
    required:
    - email
    type: object
  queries.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  queries.OrderItemPackStatusRequest:
    properties:
      is_packed:
        type: boolean
      order_id:
        type: string
      product_id:
        type: string
    required:
    - order_id
    - product_id
    type: object
  queries.OrderItemRequest:
    properties:
      order_id:
        type: string
      price:
        type: integer
      product_id:
        type: string
    required:
    - order_id
    - price
    - product_id
    type: object
  queries.OrderResponse:
    properties:
      address:
        type: string
      id:
        type: string
      is_confirmed:
        type: boolean
      is_delivered:
        type: boolean
      is_paid:
        type: boolean
      items_total:
        type: string
      started_at:
        type: string
      total_bill:
        type: integer
      user_id:
        type: string
      zip_code:
        type: string
    type: object
  queries.OrderSummaryResponse:
    properties:
      id:
        type: string
      is_delivered:
        type: boolean
      is_paid:
        type: boolean
      started_at:
        type: string
      user_id:
        type: string
    type: object
  queries.OrderUserInfoRequest:
    properties:
      address:
        type: string
      zip_code:
        type: string
    required:
    - address
    - zip_code
    type: object
  queries.OwnedProductResponse:
    properties:
      available_quantity:
        type: integer
      description:
        type: string
      details:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_available:
        type: boolean
      name:
        type: string
      price:
        type: integer
      pub_date:
        type: string
      user_id:
        type: integer
    type: object
  queries.PermissionType:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - Admin
    - Vendor
    - Customer
    - BlockUser
  queries.PhoneNumberRequest:
    properties:
      phone_number:
        type: string
    required:
    - phone_number
    type: object
  queries.ProductImageResponse:
    properties:
      id:
        type: string
      img_path:
        type: string
    type: object
  queries.ProductStatusResponse:
    properties:
      available_quantity:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      is_available:
        type: boolean
      name:
        type: string
      price:
        type: integer
      pub_date:
        type: string
    type: object
  queries.ProductSummaryResponse:
    properties:
      id:
        type: string
      name:
        type: string
      price:
        type: integer
      pub_date:
        type: string
    type: object
  queries.RelatedCommentResponse:
    properties:
      body:
        type: string
      children_amount:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      parent:
        type: string
      pub_date:
        type: string
      referrer:
        type: string
      username:
        type: string
    type: object
  queries.UpdateProductRequest:
    properties:
      description:
        type: string
      details:
        type: string
      id:
        type: string
      is_available:
        type: boolean
      name:
        maxLength: 256
        minLength: 4
        type: string
      price:
        minimum: 0
        type: integer
    required:
    - description
    - name
    - price
    type: object
  queries.UserDetailsResponse:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      id:
        type: integer
      img_path:
        description: user_profile table
        type: string
      is_active:
        type: boolean
      is_v_email:
        type: boolean
      is_v_phone_number:
        type: boolean
      permission_type:
        type: integer
      phone_number:
        type: string
      username:
        type: string
    type: object
  queries.UserPermissionRequest:
    properties:
      is_active:
        type: boolean
      permission_type:
        allOf:
        - $ref: '#/definitions/queries.PermissionType'
        minimum: 0
    type: object
  queries.UserProfileRequest:
    properties:
      bio:
        type: string
      birthday:
        type: string
    required:
    - bio
    - birthday
    type: object
host: localhost:8080
info:
  contact: {}
  title: Generic Shop API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: credential
        required: true
        schema:
          $ref: '#/definitions/queries.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: user login
      tags:
      - auth
  /categories:
    get:
      description: Returns a list of all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.Category'
            type: array
        "404":
          description: Not found
          schema:
            type: string
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Creates a new product category (admin only)
      parameters:
      - description: Category tag
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.CategoryTag'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Invalid tag
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Deletes a product category by ID (admin only)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Delete a category
      tags:
      - categories
  /categories/pc/{id}:
    get:
      description: Returns a list of tags for a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tags
          schema:
            items:
              type: string
            type: array
        "404":
          description: Product not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List tags of a product
      tags:
      - pc
  /categories/pc/set-tags/{id}:
    post:
      consumes:
      - application/json
      description: Allows Admin or Vendor to set tags for a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Tags input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.PC'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid tags
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Related product not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Set tags for a product
      tags:
      - pc
  /comments/:
    get:
      description: Returns comments with caching
      parameters:
      - description: Parent ID (UUID)
        in: query
        name: parent
        required: true
        type: string
      - description: Referrer ID (UUID)
        in: query
        name: referrer
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.CommentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List comments by parent and referrer
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Users can create comments unless blocked
      parameters:
      - description: Comment input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.CommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create a new comment
      tags:
      - comments
  /comments/{id}:
    delete:
      description: Only the owner or admin can delete a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete a comment
      tags:
      - comments
  /comments/full:
    get:
      description: Returns full comment list. Admin can see all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.RelatedCommentResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all related comments for the user
      tags:
      - comments
  /comments/overview/{id}:
    get:
      description: Only the owner or Admin can view the comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.CommentResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get a comment by ID
      tags:
      - comments
  /comments/set-active/{id}:
    put:
      consumes:
      - application/json
      description: Admin can approve or reject a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Accepted flag
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.SetFlag'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Set comment active status
      tags:
      - comments
  /orders:
    post:
      consumes:
      - application/json
      description: Creates a new order for the authenticated user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/queries.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create a new order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Get order details for the authenticated user
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.OrderResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get details of a specific order
      tags:
      - orders
  /orders/customer:
    get:
      description: List all orders created by the authenticated customer
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.OrderSummaryResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get orders for the authenticated customer
      tags:
      - orders
  /orders/items:
    delete:
      consumes:
      - application/json
      description: Deletes an order item for the authenticated user
      parameters:
      - description: Order item to delete
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.BaseOrderItemRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Remove an item from an order
      tags:
      - order-items
    post:
      consumes:
      - application/json
      description: Adds an item to the authenticated user's order
      parameters:
      - description: Order item details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.OrderItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Add an item to an order
      tags:
      - order-items
  /orders/items/customer/{id}:
    get:
      description: Returns items for the given order of the authenticated customer
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.OrderItemRequest'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List order items for a customer
      tags:
      - order-items
  /orders/items/full/{id}:
    get:
      description: Admin can retrieve all items for a specific order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.OrderItemRequest'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get all items of an order (admin only)
      tags:
      - order-items
  /orders/items/set-items-total/{total}:
    put:
      consumes:
      - application/json
      description: Updates total items for an order
      parameters:
      - description: Total number of items
        in: path
        name: total
        required: true
        type: integer
      - description: Order details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.BaseOrderItemRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Set total quantity of items in an order
      tags:
      - order-items
  /orders/items/set-packed:
    put:
      consumes:
      - application/json
      description: Admin or vendor can mark an order item as packed
      parameters:
      - description: Packed status
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.OrderItemPackStatusRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Mark order item as packed
      tags:
      - order-items
  /orders/items/vendor/{id}:
    get:
      description: Returns items for the given order accessible by vendor
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/queries.OrderItemRequest'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List order items for a vendor
      tags:
      - order-items
  /orders/set-user-info/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: User Info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/queries.OrderUserInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.OrderResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: set user info for specific order
      tags:
      - orders
  /orders/vendor:
    get:
      description: List all orders assigned to the authenticated vendor
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.OrderSummaryResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get orders for the authenticated vendor
      tags:
      - orders
  /orders/verify/{id}:
    put:
      description: Admin or authorized vendor can verify user information for an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Verification status
        in: body
